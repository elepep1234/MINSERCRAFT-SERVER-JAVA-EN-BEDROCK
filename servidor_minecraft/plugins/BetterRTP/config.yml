# GAMECRAFT - Configuración completa de RTP
# Autor: Ed Sthilaire
# Mensajes divertidos y seguros

CustomWorlds:
- world:
    UseWorldBorder: true
    MaxRadius: 15000
    MinRadius: 1000
    CenterX: 0
    CenterZ: 0
    Price: 0
    Shape: circle
    MaxY: 320
    MinY: 60
    Cooldown: 300
    Biomes:
    - PLAINS
    - FOREST
    - BIRCH_FOREST
    - FLOWER_FOREST
    - MEADOW
    - SUNFLOWER_PLAINS
Language-File: es.yml

Settings:
  Respect:
    MinePlots: false
    WorldGuard: false
    GriefPrevention: false
    Towny: false
    RedProtect: false
    FactionsUUID: false
    Lands: false
    Residence: false
    KingdomsX: false
    hClaims: false
    GriefDefender: false
    UltimateClaims: false
    Pueblos: false
    SaberFactions: false
    HuskTowns: false
    FactionsBridge: false
    CrashClaim: false
  
  Debugger: false
  PreloadRadius: 5
  MaxAttempts: 32
  
  RtpOnFirstJoin:
    Enabled: false
    World: world
    SetAsRespawn: false
  
  Cooldown:
    Enabled: true
    LockAfter: 0
    Time: 600
    PerWorld: false
  
  Delay:
    Enabled: true
    Time: 5
    CancelOnMove: true
  
  Queue:
    Enabled: true
  
  DisableUpdater: false
  
  Logger:
    Enabled: true
    LogToConsole: false
    Format: yyyy-MM-dd HH:mm:ss

Default:
  UseWorldBorder: false
  Biomes: []
  MaxRadius: 10000 # Máxima distancia desde el spawn
  MinRadius: 500 # Distancia mínima desde spawn para que aparezca aleatorio
  CenterX: 0 # Coordenadas del centro del mundo (spawn)
  CenterZ: 0
  Shape: square
  MaxY: 320
  MinY: 0
  RTPOnDeath: false

BlacklistedBlocks:
- stationary_water
- stationary_lava
- water
- flowing_water
- lava
- flowing_lava
- cactus
- leaves
- leaves_2
- air
- void_air
- bedrock
- oak_leaves
- jungle_leaves
- kelp

DisabledWorlds:
- prison
- creative
- void

# Redirección de mundos peligrosos
Overrides:
- void: world
- creative: world
- master_world: world

WorldType:
- world: NORMAL
- world_nether: NETHER
- world_the_end: NORMAL

PermissionGroup:
  Enabled: true
  Groups:
  - vip:
    - world:
        Priority: 1
        MaxRadius: 20000
        MinRadius: 1000
        Price: 0
        Cooldown: 300
        Biomes:
        - ALL
  - elite:
    - world:
        Priority: 2
        MaxRadius: 30000
        MinRadius: 1000
        Price: 0
        Cooldown: 180
        Biomes:
        - ALL
  - legend:
    - world:
        Priority: 3
        MaxRadius: 50000
        MinRadius: 1000
        Price: 0
        Cooldown: 60
        Biomes:
        - ALL

# Mensajes divertidos de RTP
Messages:
  Success: '&d✦ &a¡Teletransporte exitoso! &7Coordenadas: &e%x%&7, &e%y%&7, &e%z%
    &d✦'
  Fail: '&c&l⚠ &7No se encontró un lugar seguro después de &c%attempts% &7intentos.
    ¡Intenta de nuevo!'
  Cooldown: '&6⌛ &7Debes esperar &e%seconds% &7segundos antes de usar RTP de nuevo.'
  QueueStart: '&b&l↻ &7Buscando lugar seguro... &8(&7Esto puede tomar unos segundos&8)'
  QueueFinish: '&a&l✔ &7¡Lugar seguro encontrado! &7Teletransportando en &a3 &7segundos...'
  VoidRedirect: '&5&l⚡ &7¡El void no es seguro! Te llevaremos a un mundo mejor.'
  InCombat: '&c&l⚔ &7¡No puedes usar RTP durante el combate!'
  NotEnoughMoney: '&c&l$ &7Necesitas &e%price% &7monedas para usar RTP.'
  NoPermission: '&c&l✖ &7No tienes permiso para usar este comando.'

# Configuración de placeholders
betterrtp_count: Cantidad total de /rtp realizados
betterrtp_cooldown: Cooldown en el mundo actual
betterrtp_cooldown_<world_name>: Cooldown de un mundo específico
betterrtp_cooldowntime: Tiempo restante de cooldown en el mundo actual
betterrtp_cooldowntime_<world_name>: Tiempo restante de cooldown en un mundo específico
betterrtp_canrtp: Razón o 'sí' si el jugador puede /rtp en este mundo
betterrtp_canrtp_<world_name>: Razón o 'sí' si puede /rtp en un mundo específico
betterrtp_canrtpcooldown: Si puede /rtp basado solo en cooldown
betterrtp_canrtpcooldown_<world_name>: Lo mismo para un mundo específico
betterrtp_canrtpprice: Si puede /rtp basado en saldo bancario
betterrtp_canrtpprice_<world_name>: Lo mismo para un mundo específico
betterrtp_canrtphunger: Si puede /rtp basado en hambre
betterrtp_canrtphunger_<world_name>: Lo mismo para un mundo específico
betterrtp_price: Precio de /rtp en el mundo actual
betterrtp_price_<world_name>: Precio de /rtp en un mundo específico

Config:
  TimeFormat:
    Days: '&e{0}&7d'
    Hours: '&e{0}&7h'
    Minutes: '&e{0}&7m'
    Seconds: '&e{0}&7s'
    ZeroAll: '&7Ninguno'
    Infinite: '&d∞'
    Separator:
      Middle: ' '
      Last: ' y '
  CanRTP:
    Success: '&a&l✓ &7¡Listo para teletransportarte!'
    NoPermission: '&c&l✖ &7Necesitas un rango más alto para usar RTP.'
    Cooldown: '&6⌛ &7Tiempo restante: &e%time%'
    Price: '&c&l$ &7Necesitas &e%price% &7monedas.'
    Hunger: '&c&l☠ &7¡Come algo antes de usar RTP!'
