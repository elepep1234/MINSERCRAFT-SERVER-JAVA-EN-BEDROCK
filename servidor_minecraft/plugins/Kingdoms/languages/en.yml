# Read config.yml 'prefix' option for info.
prefix: '&6[&lGAMECRAFT&6] &2'
chat-input:
  # Durante las entradas de chat (usado principalmente en GUIs como preguntar por nombre de rango, prioridad, etc)
  # Cuando el jugador escribe esto en el chat, cancela la operación.
  # Lo más sostenible para usar en mensajes flotantes tes el comando '/cancel'.

  # La razón por la que esto no admite múltiples palabras es para minimizar la cantidad
  # de entradas que los jugadores pueden elegir para todas las entradas de chat.
  cancel: cancelar
  error: '{$e}Ocurrió un error al procesar tu entrada de chat. Si eres un jugador, reporta esto a los administradores, si eres un administrador, revisa los registros de la consola.'

# Usualmente el marcador %world% muestra el nombre sin formato para propósitos internos (como mensajes flotantes)
# Pero esto se usa para el marcador %translated-world% y lugares donde los mensajes no pueden ser traducidos directamente.
worlds:
  world: Mundo Principal
  world_nether: El Nether
  world_the_end: El Fin

# Usado para mostrar sin límite. Actualmente solo se usa para códigos de invitación.
unlimited: '&5Ilimitado'

# Usado para el modificador de marcador booleano.
enabled: '{$p}✔'
disabled: '{$e}✗'

# Usado para comandos que requieren un sí/no.
true: verdadero
false: falso

# Usado en lugares donde los datos ya no están disponibles.
# Por ejemplo, un reino que envió un correo fue disuelto.
unknown: '&4Desconocido'
unsupported: '&4No soportado'

# Usado cuando una entrada de mensaje definida
# en la configuración no está establecida en el archivo de idioma.
unknown-message-entry: '{$e}Entrada de mensaje desconocida'

# Usado para ausencia de un valor.
none: '&4Ninguno'

# Usado como título genérico para errores de GUI al hacer clic en elementos.
error: '&4Error'

# Usado para palabras cuando están configuradas fuera de los archivos de idioma.
words:
  resource-points: Puntos de Recursos
  fuel: Combustible

# Usado para marcadores basados en tiempo.
# Los marcadores de tiempo predeterminados como %kingdoms_shield_time% se muestran como
# números aleatorios si los usas así, debes usar el modificador de temporizador:
# %kingdoms_time_shield_time%
time-formatter:
  millis: '%millis% milisegundos'
  seconds: '%ssa% segundos'
  minutes: '%mmaf%:%ssf%'
  hours: '%hhaf%:%mmf%:%ssf%'
  days: '%dda% día(s), %hhf%:%mmf%:%ssf%'
  weeks: '%wwwwa% semana(s), %dd% día(s), %hhf%:%mmf%:%ssf%'
  months: '%MMA% mes(es), %wwww% semana(s), %dd% día(s), %hhf%:%mmf%:%ssf%'

# Used for date-based placeholders.
# The default time related placeholders like %kingdoms_since% are shown as
# random numbers if you use it just like that, you'd have to use the date modifier:
# %date@kingdoms_since%

# It uses Java's default date formatter syntax which can be found here:
# https://docs.oracle.com/javase/8/docs/api/java/time/format/DateTimeFormatter.html#patterns
date-formatter: '{$s}yyyy{$sep}/{$s}MM{$sep}/{$s}dd {$s}HH{$colon}{$s}mm{$colon}{$s}ss'

# Usado para /k map y /k claim line
cardinal-directions:
  north: Norte
  east: Este
  south: Sur
  west: Oeste
  north-east: Noreste
  north-west: Noroeste
  south-east: Sureste
  south-west: Suroeste

# Usado para variables {$name} dentro de otros mensajes.
variables:
  cancel: '&co escribe hover:{&ecancelar;&eClick para cancelar;/cancel} &cpara cancelar la acción.'
  usage: '&4Uso{$colon} {$es}/k '
  enabled: '&8[&aActivado&8]&2'
  disabled: '&8[&cDesactivado&8]&4'
  currency-symbol: $
  ok: hover:{&8[&9Aceptar&8];&7Click;/k session %command_namespace% %command_session_id% OK}
  yes: hover:{&8[&2Sí&8];&7Click;/k session %command_namespace% %command_session_id% YES}
  no: hover:{&8[&cNo&8];&7Click;/k session %command_namespace% %command_session_id% NO}
  kingdom-lvl-II: '&cRequiere Nivel de Reino &eII'
  kingdom-lvl-III: '&cRequiere Nivel de Reino &eIII'
  kingdom-lvl-IV: '&cRequiere Nivel de Reino &eIV'
  kingdom-lvl-V: '&cRequiere Nivel de Reino &eV'
  chk-kingdom-lvl-II: '{? kingdoms_kingdom_level < 2 ? "{$kingdom-lvl-II}"}'
  chk-kingdom-lvl-III: '{? kingdoms_kingdom_level < 3 ? "{$kingdom-lvl-III}"}'
  chk-kingdom-lvl-IV: '{? kingdoms_kingdom_level < 4 ? "{$kingdom-lvl-IV}"}'
  chk-kingdom-lvl-V: '{? kingdoms_kingdom_level < 5 ? "{$kingdom-lvl-V}"}'

# Mensajes usados principalmente para /k map
maps:
  name: Mapa

# Los siguientes valores se utilizan cuando no hay un mensaje personalizado establecido para ciertas acciones.
value:
  enter: '{$p}Por favor ingresa un valor {$cancel}'
  min: '{$e}El valor mínimo requerido es{$colon} {$es}%min%'
  max: '{$e}El valor máximo es{$colon} {$es}%max%'
setters:
  
  # Usado para comandos que admiten números relativos a algo más.
  type:
    add: añadir aumentar mas +
    subtract: remover disminuir restar menos -
    set: establecer =
    unknown: '{$e}Tipo de establecedor desconocido{$colon} {$es}%setter_type%'
channels:
  
  default:
    permission-fail: '{$e}No tienes permiso para usar el canal %channel_color%%channel_name%.'
  global:
    name: Global
    short-name: G
  kingdom:
    name: Reino
    short-name: R
  ally:
    name: Aliado
    short-name: A
  truce:
    name: Tregua
    short-name: T
  nation:
    name: Nación
    short-name: N
  ranged:
    name: Rango
    short-name: R
  help:
    name: Ayuda
    short-name: H
  staff:
    name: Personal
    short-name: P

