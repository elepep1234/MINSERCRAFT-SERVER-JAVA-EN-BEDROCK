(import):
  building:
    anchors: [&holograms holograms]
    extend: false
  structure:
    parameters:
      <name>: nexus
      <build-duration-factor>: '-45 seconds'
      <durability-factor>: 100
      <material-1>: BEACON
      <material-2>: BEACON
      <material-3>: BEACON

# Refer to config.yml for more nexus options.
name: "&bNexus"
type: nexus
default-name: "Nexus"
max-level: 5
upgrade-cost: 'level * 1000'
dont-update-holograms: true
hide-holograms: true

building:
  4:
    functional-points: *fnPoints
    block:
      material: BEACON
    holograms: *holograms
    schematic: '<type>/<name>/4'
  5:
    functional-points: *fnPoints
    block:
      material: BEACON
    holograms: *holograms
    schematic: '<type>/<name>/5'
  1:
    # [Final]
    functional-points: &fnPoints
      0, 1, 0:
        - {type: activation, name: main}
        - {type: interaction, name: main}
        - {type: manual, name: main}
  2:
    # [Final]
    functional-points: *fnPoints
  3:
    # [Final]
    functional-points: *fnPoints

particles:
  1:
    place:
      particle: DRAGON_BREATH
      count: 70
      offset: 0.5, 0.5, 0.5
    break:
      particle: DRAGON_BREATH
      count: 70
      offset: 0.5, 0.5, 0.5