##                          ##
##         BlueMap          ##
##      Webapp-Config       ##
##                          ##

# Activa la creación y actualización de los archivos de la webapp
enabled: true

# Carpeta donde se alojan los archivos de la webapp
webroot: "bluemap/web"

# Sincroniza settings.json con los mapas actuales
update-settings-file: true

# Usa cookies para guardar preferencias del usuario
use-cookies: true

# Vista por defecto: perspectiva (false = no plano)
default-to-flat-view: false

# Posición inicial de la cámara (descomenta y personaliza si quieres)
#start-location: "world:0:16:-32:390:0.1:0.19:0:0:perspective"

# Distancia mínima y máxima de zoom
min-zoom-distance: 5
max-zoom-distance: 100000

# Resolución por defecto (1 = normal)
resolution-default: 1

# Configuración del slider de renderizado en alta resolución
hires-slider-max: 500
hires-slider-default: 100
hires-slider-min: 0

# Configuración del slider de renderizado en baja resolución
lowres-slider-max: 7000
lowres-slider-default: 2000
lowres-slider-min: 500

# Puedes usar un CDN para cargar los datos del mapa (opcional)
#map-data-root: "https://cdn.mi-dominio.com/mapdata"
#live-data-root: "https://cdn.mi-dominio.com/livedata"

# Scripts personalizados (descomenta si tienes alguno)
scripts: [
  #"js/mi-script.js"
]

# Estilos personalizados (descomenta si tienes alguno)
styles: [
  #"css/mi-estilo.css"
]
