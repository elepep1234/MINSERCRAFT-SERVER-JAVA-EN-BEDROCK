##                          ##
##         BlueMap          ##
##     Webserver-Config     ##
##                          ##

# Habilita el servidor web integrado de BlueMap
enabled: true

# Carpeta donde se alojan los archivos del mapa
webroot: "bluemap/web"

# Puerto donde se sirve el mapa (debe coincidir con el túnel en Playit.gg)
port: 8100

# Configuración del registro de actividad del servidor web
log: {
  # Archivo donde se guardan los logs de acceso
  file: "bluemap/logs/webserver.log"

  # Si se debe añadir al archivo existente (false = sobrescribe)
  append: false

  # Formato de los logs (dirección IP, método, URL, protocolo, estado)
  format: "%1$s \"%3$s %4$s %5$s\" %6$s %7$s"
}
