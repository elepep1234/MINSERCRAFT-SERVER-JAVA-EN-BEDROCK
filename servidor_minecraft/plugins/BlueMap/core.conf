##                          ##
##         BlueMap          ##
##       Core-Config        ##
##                          ##

# Aceptas el EULA de Mojang y permites que BlueMap descargue los archivos necesarios
accept-download: true

# Carpeta donde BlueMap guarda sus datos internos y progreso de renderizado
data: "bluemap"

# Número de hilos para renderizar (ajusta según tu CPU)
# Ejemplo: -2 en una CPU de 6 núcleos = 4 hilos
render-thread-count: 2

# Permite que BlueMap detecte recursos de mods y datapacks
scan-for-mod-resources: true

# Permite enviar métricas básicas para ayudar al desarrollo del plugin
metrics: true

# Configuración del log de depuración
log: {
  # Archivo donde se guardan los logs de depuración
  file: "bluemap/logs/debug.log"

  # Si se debe añadir al archivo existente (false = sobrescribe)
  append: false
}
