##                          ##
##         BlueMap          ##
##        Map-Config        ##
##                          ##

# Carpeta del mundo que se va a renderizar
world: "world"

# Dimensión del mundo
dimension: "minecraft:overworld"

# Nombre visible del mapa en la web
name: "Reino Principal"

# Orden de aparición en la lista de mapas
sorting: 0

# Posición inicial del mapa (opcional, puedes activarla si quieres centrar en una zona específica)
#start-pos: {x:500, z:-820}

# Colores visuales
sky-color: "#7dabff"
void-color: "#000000"

# Iluminación
sky-light: 1
ambient-light: 0.1

# Renderizado de cuevas
remove-caves-below-y: 55
cave-detection-ocean-floor: -5
cave-detection-uses-block-light: false

# Solo renderiza chunks visitados si se cambia este valor
min-inhabited-time: 0

# Máscara de renderizado (desactivada por defecto)
render-mask: []

# Bordes del mapa
render-edges: true
edge-light-strength: 8

# Vistas disponibles
enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true

# Calidad del renderizado
enable-hires: true

# Tipo de almacenamiento
storage: "file"

# Renderiza chunks sin datos de luz (solo si tienes problemas con mods)
ignore-missing-light-data: false

# Marcadores estáticos (puedes agregar aquí tus puntos de interés)
marker-sets: {
  kingdom-markers: {
    label: "Reinos",
    markers: {
      dragon-realm: {
        label: "Reino Dragón",
        position: [250, 70, -180],
        type: "html",
        detail: "<div style='background:#222;color:#fff;padding:10px;border-radius:5px;'>🛡️ Reino Dragón<br>Puntos: 1250</div>"
      }
    }
  }
}
