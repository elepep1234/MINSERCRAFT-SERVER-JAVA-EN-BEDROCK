##                          ##
##         BlueMap          ##
##        Map-Config        ##
##                          ##

world: "world_the_end"
dimension: "minecraft:the_end"
name: "El End"
sorting: 200

sky-color: "#080010"
void-color: "#080010"
sky-light: 1
ambient-light: 0.6

remove-caves-below-y: -10000
cave-detection-ocean-floor: -5
cave-detection-uses-block-light: false

min-inhabited-time: 0
render-mask: []
render-edges: true
edge-light-strength: 8

enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true
enable-hires: true

storage: "file"
ignore-missing-light-data: false

marker-sets: {
  end-markers: {
    label: "Puntos de Interés",
    markers: {
      central-portal: {
        label: "Portal de Regreso",
        position: [0, 64, 0],
        type: "html",
        detail: "<div style='background:#1a1a1a;color:#fff;padding:10px;border-radius:5px;'>🌀 Portal al Overworld<br>Coordenadas: 0, 64, 0</div>"
      }
    }
  }
}
