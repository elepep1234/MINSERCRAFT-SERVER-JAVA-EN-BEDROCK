world: "world_nether"
dimension: "minecraft:the_nether"
name: "El Nether"
sorting: 100

sky-color: "#290000"
void-color: "#150000"
sky-light: 1
ambient-light: 0.6

remove-caves-below-y: -10000
cave-detection-ocean-floor: -5
cave-detection-uses-block-light: false

min-inhabited-time: 0

render-mask: [
  {
    #min-x: -4000
    #max-x: 4000
    #min-z: -4000
    #max-z: 4000
    #min-y: 50
    #max-y: 100
  },
  {
    subtract: true
    min-y: 90
    max-y: 127
  }
]

render-edges: true
edge-light-strength: 8

enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true
enable-hires: true

storage: "file"
ignore-missing-light-data: false

marker-sets: {
  nether-points: {
    label: "Puntos del Nether",
    markers: {
      fortress-entrance: {
        label: "Entrada a Fortaleza",
        position: [120, 65, -340],
        type: "html",
        detail: "<div style='background:#330000;color:#fff;padding:10px;border-radius:5px;'>🔥 Fortaleza del Nether<br>Coordenadas: 120, 65, -340</div>"
      }
    }
  }
}
