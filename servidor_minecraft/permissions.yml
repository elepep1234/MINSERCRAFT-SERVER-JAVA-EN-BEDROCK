groups:
  default:
    default: not_op
    permissions:
    - bukkit.broadcast.user
    - bukkit.command.help
    - bukkit.command.list
    - bukkit.command.me
    - bukkit.command.tell
      
  moderator:
    default: false
    inheritance:
    - default
    permissions:
    - bukkit.command.kick
    - bukkit.command.ban
    - bukkit.command.unban
    - bukkit.command.tp
    - bukkit.command.gamemode
    - bukkit.command.time

  admin:
    default: op
    inheritance:
    - moderator
    permissions:
    - bukkit.command.*
    - minecraft.command.*
      - minecraft.command.time
      - minecraft.command.gamemode
      - minecraft.command.tp
      
  admin:
    inheritance:
      - moderator
    permissions:
      - bukkit.command.*
      - minecraft.command.*
      - '*'
